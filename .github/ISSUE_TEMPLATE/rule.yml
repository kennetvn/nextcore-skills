name: New rule or measurement trap
description: Propose a slop rule, a token check, a card check, or a trap — backed by a real case.
labels: [rule-proposal]
body:
  - type: textarea
    id: story
    attributes:
      label: Where it bit you
      description: What shipped, what it cost, how it was found.
    validations:
      required: true
  - type: textarea
    id: bad
    attributes:
      label: Example that must be flagged
      render: text
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: Similar example that must NOT be flagged
      description: The false positive you expect to fight.
      render: text
    validations:
      required: true
