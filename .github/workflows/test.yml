name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # dogfood: the published bins must run and the good fixtures must stay clean
      - run: node skills/nextcore-design/scripts/slop-check.mjs tests/fixtures/good
      - run: node skills/nextcore-design/scripts/token-audit.mjs tests/fixtures/tokens/good.css --src tests/fixtures/tokens/good-src
      - run: node skills/nextcore-design/scripts/design-card.mjs tests/fixtures/drawings/good --tokens tests/fixtures/tokens/good.css --fonts "Inter,Fraunces" --app tests/fixtures/app --strict
      - run: node skills/nextcore-design/scripts/design-review.mjs tests/fixtures/drawings --out review.html
      - name: design-review screenshot (Chrome is preinstalled on Linux runners)
        if: runner.os == 'Linux' && matrix.node == 20
        run: node skills/nextcore-design/scripts/design-review.mjs tests/fixtures/drawings --out review.html --shot review.png && test -s review.png
