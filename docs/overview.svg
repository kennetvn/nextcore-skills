<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">How the three plugins fit together</title>
  <desc id="d">nextcore-design turns a brief into a spec with a field map and a drawing; nextcore-dev turns the field map into an API contract and the UI state signals; the shipped screen is measured against the drawing. nextcore-workflow wraps both: gates, diagnosis before patching, evidence before done, parallel agents, and lessons flowing back.</desc>
  <style>
    .wrap { fill: none; stroke: #8A94A3; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .box { fill: #F5F8FA; stroke: #C9D1DA; stroke-width: 1.5; }
    .key { fill: #E6F4FB; stroke: #0369A1; stroke-width: 1.5; }
    .h { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0B0B0D; }
    .s { font: 400 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #3D4450; }
    .p { font: 700 12px ui-monospace, 'SF Mono', Menlo, monospace; fill: #0369A1; }
    .w { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5A6270; }
    .ln { stroke: #8A94A3; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #16181D; stroke: #3A414B; } .key { fill: #0B2A3B; stroke: #56C5FF; }
      .h { fill: #F2F4F7; } .s { fill: #A7AFBA; } .p { fill: #56C5FF; } .w { fill: #A7AFBA; }
      .wrap, .ln { stroke: #6B7480; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A94A3"/>
    </marker>
  </defs>

  <rect class="wrap" x="8" y="8" width="944" height="284" rx="16"/>
  <text class="p" x="28" y="34">nextcore-workflow</text>
  <text class="w" x="168" y="34">gates · diagnose before the 3rd patch · evidence before "done" · parallel agents &amp; accounts · docs that expire · lessons flow back</text>

  <rect class="box" x="28" y="62" width="200" height="104" rx="12"/>
  <text class="p" x="44" y="86">brief</text>
  <text class="h" x="44" y="108">What and for whom</text>
  <text class="s" x="44" y="128">goal · primary action</text>
  <text class="s" x="44" y="144">FACT vs ASSUMPTION</text>

  <rect class="key" x="262" y="62" width="200" height="104" rx="12"/>
  <text class="p" x="278" y="86">nextcore-design</text>
  <text class="h" x="278" y="108">Spec + drawing</text>
  <text class="s" x="278" y="128">field map · 5 states × 3 widths</text>
  <text class="s" x="278" y="144">critic agent · design card</text>

  <rect class="key" x="496" y="62" width="200" height="104" rx="12"/>
  <text class="p" x="512" y="86">nextcore-dev</text>
  <text class="h" x="512" y="108">API contract</text>
  <text class="s" x="512" y="128">field → shape → UI state signal</text>
  <text class="s" x="512" y="144">auth counted · decimal money</text>

  <rect class="box" x="730" y="62" width="200" height="104" rx="12"/>
  <text class="p" x="746" y="86">ship</text>
  <text class="h" x="746" y="108">Built 1:1</text>
  <text class="s" x="746" y="128">no re-layout mid-build</text>
  <text class="s" x="746" y="144">jobs · migrations · data fixes</text>

  <path class="ln" d="M228 114H258" marker-end="url(#a)"/>
  <path class="ln" d="M462 114H492" marker-end="url(#a)"/>
  <path class="ln" d="M696 114H726" marker-end="url(#a)"/>

  <rect class="box" x="262" y="196" width="668" height="76" rx="12"/>
  <text class="p" x="278" y="220">measure — zero-dependency tools, any stack that renders HTML</text>
  <text class="s" x="278" y="242">slop-check · token-audit (contrast in every theme) · design-card · design-review (squint tests) · doc-drift</text>
  <text class="s" x="278" y="260">mismatch ⇒ fix the code, or the drawing becomes D2 — never silently</text>
  <path class="ln" d="M830 166V192" marker-end="url(#a)"/>
  <path class="ln" d="M362 196V170" marker-end="url(#a)"/>
</svg>
